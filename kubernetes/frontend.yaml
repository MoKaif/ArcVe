apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcve-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcve-frontend
  template:
    metadata:
      labels:
        app: arcve-frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/arcve-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://arcve-backend:8000"
---
apiVersion: v1
kind: Service
metadata:
  name: arcve-frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
  selector:
    app: arcve-frontend
