apiVersion: v1
kind: Service
metadata:
  name: arcve-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: arcve-db
subsets:
  - addresses:
      - ip: 172.17.0.1 # Default Docker bridge gateway (Host IP on most Linux setups)
    ports:
      - port: 5432
