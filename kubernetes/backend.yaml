apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcve-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arcve-backend
  template:
    metadata:
      labels:
        app: arcve-backend
    spec:
      containers:
      - name: backend
        image: your-registry/arcve-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@arcve-db:5432/arcve
---
apiVersion: v1
kind: Service
metadata:
  name: arcve-backend
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: arcve-backend
